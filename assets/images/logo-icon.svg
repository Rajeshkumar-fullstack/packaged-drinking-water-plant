<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="apBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C2FF"/>
      <stop offset="55%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#023E8A"/>
    </linearGradient>
    
    <!-- Droplet Body Gradient -->
    <linearGradient id="apDropBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <!-- Water Wave Gradient -->
    <linearGradient id="apWaveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00A8E8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Pure Water Bevel Highlight -->
    <linearGradient id="apBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Light Sweep Diagonal Gradient -->
    <linearGradient id="apSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#E0F2FE" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="apDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#023E8A" flood-opacity="0.35"/>
    </filter>

    <!-- Squircle Clip Mask for Light Sweep -->
    <clipPath id="apSquircleClip">
      <rect x="2" y="2" width="44" height="44" rx="13"/>
    </clipPath>

    <style>
      /* <![CDATA[ */
      /* Liquid Wave Flow and Buoyancy */
      @keyframes apWaveFlow {
        0% { transform: translateY(0px) scaleY(1); }
        50% { transform: translateY(-0.75px) scaleY(1.025); }
        100% { transform: translateY(0px) scaleY(1); }
      }
      .ap-anim-wave {
        animation: apWaveFlow 3.2s ease-in-out infinite;
        transform-origin: 24px 34px;
      }

      /* Droplet Gentle Surface Tension Breathing */
      @keyframes apDropletBreathe {
        0% { transform: scale(1); }
        50% { transform: scale(1.015); }
        100% { transform: scale(1); }
      }
      .ap-anim-droplet {
        animation: apDropletBreathe 4s ease-in-out infinite;
        transform-origin: 24px 28px;
      }

      /* Sparkling Diamond Glint Twinkle */
      @keyframes apSparkleTwinkle {
        0%, 100% {
          transform: scale(1) rotate(0deg);
          opacity: 0.85;
        }
        40% {
          transform: scale(1.35) rotate(18deg);
          opacity: 1;
        }
        70% {
          transform: scale(0.9) rotate(-8deg);
          opacity: 0.7;
        }
      }
      .ap-anim-sparkle {
        animation: apSparkleTwinkle 3.5s ease-in-out infinite;
        transform-origin: 29.5px 15px;
      }

      /* Orbital Purity Dashed Ring Pulse */
      @keyframes apOrbitalFlow {
        0% {
          stroke-dashoffset: 0;
          opacity: 0.35;
        }
        50% {
          opacity: 0.75;
        }
        100% {
          stroke-dashoffset: -22;
          opacity: 0.35;
        }
      }
      .ap-anim-orbital {
        animation: apOrbitalFlow 7s linear infinite;
      }

      /* Diagonal Light Sweep Across Squircle */
      @keyframes apLightSweepPass {
        0% {
          transform: translateX(-55px) rotate(25deg);
        }
        25%, 100% {
          transform: translateX(75px) rotate(25deg);
        }
      }
      .ap-anim-sweep {
        animation: apLightSweepPass 6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        animation-delay: 1.2s;
      }

      /* Specular Reflection Glow */
      @keyframes apSpecularGleam {
        0%, 100% { opacity: 0.85; stroke-width: 2px; }
        50% { opacity: 1; stroke-width: 2.3px; }
      }
      .ap-anim-specular {
        animation: apSpecularGleam 3s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .ap-anim-wave,
        .ap-anim-droplet,
        .ap-anim-sparkle,
        .ap-anim-orbital,
        .ap-anim-sweep,
        .ap-anim-specular {
          animation: none !important;
        }
      }
      /* ]]> */
    </style>
  </defs>

  <!-- Container Squircle with Soft Glow -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#apBgGrad)"/>
  <rect x="2.75" y="2.75" width="42.5" height="42.5" rx="12.25" stroke="url(#apBevel)" stroke-width="1.5"/>

  <!-- Orbital Purity Wave Ring -->
  <path class="ap-anim-orbital" d="M9 28.5 A15 15 0 0 0 39 28.5" stroke="#FFFFFF" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 3.5" opacity="0.45"/>

  <!-- Central Water Droplet with Natural Surface Tension -->
  <g filter="url(#apDropShadow)" class="ap-anim-droplet">
    <path d="M24 7.5 C24 7.5 35.5 21 35.5 28.5 C35.5 34.85 30.35 40 24 40 C17.65 40 12.5 34.85 12.5 28.5 C12.5 21 24 7.5 24 7.5 Z" fill="url(#apDropBody)"/>
  </g>

  <!-- Dynamic Mineral Wave Swirl Inside Droplet -->
  <path class="ap-anim-wave" d="M13.2 29.5 C16.5 26.5 20.2 26.8 24 29 C27.8 31.2 31.5 30.8 34.8 28 C34.2 34.5 29.8 39.5 24 39.5 C18.2 39.5 13.8 34.5 13.2 29.5 Z" fill="url(#apWaveGrad)"/>

  <!-- Specular Reflection Arc -->
  <path class="ap-anim-specular" d="M17.5 19 C15.8 22.5 15.6 26.5 16.8 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.95"/>

  <!-- Pristine Diamond Sparkle Glint -->
  <path class="ap-anim-sparkle" d="M29.5 12 L30.2 14.2 L32.5 15 L30.2 15.8 L29.5 18 L28.8 15.8 L26.5 15 L28.8 14.2 Z" fill="#FFFFFF"/>

  <!-- Diagonal Light Sweep Sheen Across Squircle Surface -->
  <g clip-path="url(#apSquircleClip)" pointer-events="none">
    <rect class="ap-anim-sweep" x="-35" y="-15" width="22" height="75" fill="url(#apSweepGrad)" transform="rotate(25 24 24)"/>
  </g>
</svg>
